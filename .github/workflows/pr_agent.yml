name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

jobs:
  pr_agent_job:
    name: Run PR Agent on pull requests & issue comments
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Run PR Agent
        id: pragent
        uses: qodo-ai/pr-agent@main # 🔒 Pin version for stability
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Azure OpenAI configuration
          OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          OPENAI_API_TYPE: "azure"
          OPENAI_API_VERSION: "2025-04-14"
          OPENAI_API_BASE: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          OPENAI_DEPLOYMENT_ID: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

          # Model configuration
          CONFIG_MODEL: "gpt-4.1"
          CONFIG_FALLBACK_MODELS: '["gpt-4.1"]'

          # PR Agent behavior
          GITHUB_ACTION_CONFIG_AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG_AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG_AUTO_IMPROVE: "true"
